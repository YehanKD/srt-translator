name: CI

# Runs on every push and pull request. The point is to catch a broken build
# before it reaches a release: a Windows packaging failure once shipped because
# nothing checked it automatically, and it was found by a user instead.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The deb target needs these; without them electron-builder's deb step
      # fails in a way that reads like a config error rather than a missing tool.
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcrypt-compat fakeroot

      - name: Build
        run: npm run package:linux

      - name: Confirm the artifacts exist
        run: |
          ls -la release/*.AppImage release/*.deb
          test -f "release/SRT Translator-$(node -p "require('./package.json').version").AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 7
