appId: com.srt-translator.app
productName: SRT Translator
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!out/**/*.tsbuildinfo'
asar: true
# `maximum` builds the squashfs with xz, which is decompressed on the fly through
# FUSE at every file read. Electron touches hundreds of files during startup, so
# that turned a cold launch into a 77-second wait. `normal` uses zstd — the file
# is a little larger but starts in about a second, which is the trade that
# matters for a desktop app.
compression: normal
electronLanguages:
  - en-US
removePackageScripts: true

win:
  target: nsis
  icon: build/icon.ico
  # Windows has no system MKVToolNix by default, so ship the bundled binaries.
  extraResources:
    - from: resources/tools
      to: tools

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  target:
    - appImage
    - deb
  icon: build/icon.png
  category: Utility
  synopsis: Subtitle translator — any language into natural spoken Sinhala
  maintainer: Yehan <yehan@swict.lk>
  syncDesktopName: true
  # Linux uses the system MKVToolNix (pacman/apt) via the PATH lookups in
  # mkv-extract.ts. The bundled tools are Windows .exe files, so shipping them
  # here would only bloat the package (~38 MB) — deliberately omitted.
  extraResources: []
