appId: com.srt-translator.app
productName: SRT Translator
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!out/**/*.tsbuildinfo'
asar: true
compression: maximum
electronLanguages:
  - en-US
removePackageScripts: true

win:
  target: nsis
  icon: build/icon.ico
  # Windows has no system MKVToolNix by default, so ship the bundled binaries.
  extraResources:
    - from: resources/tools
      to: tools

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  target:
    - appImage
    - deb
  icon: build/icon.png
  category: Utility
  synopsis: AI-powered English to Sinhala SRT subtitle translator
  maintainer: Yehan <yehan@swict.lk>
  syncDesktopName: true
  # Linux uses the system MKVToolNix (pacman/apt) via the PATH lookups in
  # mkv-extract.ts. The bundled tools are Windows .exe files, so shipping them
  # here would only bloat the package (~38 MB) — deliberately omitted.
  extraResources: []
